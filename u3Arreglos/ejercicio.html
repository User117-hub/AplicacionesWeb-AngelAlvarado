<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EjerciciosP2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <main class="container">
        <div class="row justify-content-center align-items-center min-vh-100 g-3">
            <section class="col-12 col-sm-8 col-md-4 p-3 text-center border border-2 rounded-4 custom-section">
                <h2>Agenda</h2>
                <form action="#">
                    <label for="elegirDia">Dia:</label>
                    <select id="dia" size="1">
                        <option value="0">Lunes</option>
                        <option value="1">Martes</option>
                        <option value="2">Miercoles</option>
                        <option value="3">Jueves</option>
                        <option value="4">Viernes</option>
                        <option value="5">Sabado</option>
                        <option value="6">Domingo</option>
                    </select><br>
                    <label for="elegirHora">Hr:</label>
                    <input type="text" id="hora" name="hora"><br>
                    <label for="elegirEvento">Evento:</label>
                    <input type="text" id="evento" name="evento"><br>
                    <label for="elegirDesc">Descripcion:</label><br>
                    <textarea cols="20" rows="5" id="descrip" name="descrip"></textarea><br>
                    <input type="button" value="Guardar" class="btn btn-primary" onclick="guardar_agenda()">
                </form>
                <table class="table" id="table">
                        <thead>
                        <tr>
                            <th>Dia</th>
                            <th>Hr</th>
                            <th>Evento</th>
                            <th>Descripcion</th>
                        </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
            </section>
            <ul>
                <li>
                    <a href="ejercicio1.html">Muertes</a>
                </li>
                <li>
                    <a href="ejercicio2.html">Nombre alumnos</a>
                </li>
                <li>
                    <a href="ejercicio3.html">Letra</a>
                </li>
                <li>
                    <a href="ejercicio4.html">Puestos</a>
                </li>
                <li>
                    <a href="ejercicio5.html">Agenda</a>
                </li>
            </ul>
        </div>
    </main>
    <script src="js/arreglos.js"></script>
</body>
</html>
