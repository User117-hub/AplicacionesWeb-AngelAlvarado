</head>
<body>
    <section class="layout-principal">
        <aside id="barra_lateral">
            <nav>
                <p>Menú</p>
                <ul>
                    <li><a href="home.html"><span class="material-symbols-outlined">home</span> Home</a></li>

                    <li><a href="playlist.html"><span class="material-symbols-outlined">playlist_play</span> Playlist</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <section id="principal">
                <article>
                  <form name="frmUsuario" action="#" method="post" enctype="multipart/form-data">
                    <fieldset>
                        <div id="registro">
                            <div class="campo">
                                <label>Nombre:</label>
                                <input type="text" id="nombre" />
                            </div>
                            <div class="campo">
                                <label>Edad:</label>
                                <input type="number" id="edad" /><br>
                            </div>
                            <div class="campo">
                                <label> Género:</label>
                                    <input type="radio" name="genero" id="genero" value="F">F
                                    <input type="radio" name="genero" id="genero" value="M">M
                            </div>
                            <div class="campo">
                                <label>Trayectoria:</label>
                                <input type="text" id="trayectoria"/> años<br>
                            </div>
                        </div>
                            
                            <div id="cuadro-foto">
                                <label>Foto:</label>
                                <input type="file" id="foto">
                            </div>
                        </div>
                    </fieldset>
                    <button type="button" id="boton" onclick="cantante()">Guardar</button>
                    </form>
                </article>
            </section>
        </main>
    </section>

    <footer>
        <article class="pie">
